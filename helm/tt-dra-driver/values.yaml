# Default values for tt-dra-driver.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
selectorLabelsOverride: {}

# deviceProfile selects the kind of devices managed by this driver
# instance. Currently the only supported profile is "tenstorrent".
deviceProfile: "tenstorrent"

# driverName uniquely identifies the driver within the cluster. When empty
# its value is derived from the deviceProfile.
driverName: ""

imagePullSecrets:
  - name: tt-dra-driver

image:
  repository: ghcr.io/tenstorrent/tt-dra-driver
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

kubeletPlugin:
  # fabricManagerAgentAddress is the host:port the kubelet plugin uses to
  # talk to the per-node Tenstorrent Fabric Manager (TTFM) agent and
  # enumerate local ASICs. The default targets the agent Service shipped
  # by the upstream TTFM chart, which uses
  # `internalTrafficPolicy: Local` so requests stay on the originating
  # node (each kubelet plugin must talk to its own node's agent). The
  # name is `<release>-agent.<namespace>.svc.cluster.local`; the default
  # below assumes the chart is installed as release `ttfm` in namespace
  # `ttfm` (matches demo/scripts/common.sh). Override per cluster as
  # needed.
  fabricManagerAgentAddress: "ttfm-agent.ttfm.svc.cluster.local:50053"
  priorityClassName: "system-node-critical"
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector:
    tenstorrent.com/has-tt: "true"
  tolerations: []
  affinity: {}
  kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
  kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
  containers:
    plugin:
      securityContext:
        privileged: true
      resources: {}
      # Port for the gRPC liveness service. Set to a negative value to
      # disable the service and the probe.
      healthcheckPort: 51515
