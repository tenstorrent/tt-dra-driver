{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tt-dra-driver.serviceAccountName" . }}
  namespace: {{ include "tt-dra-driver.namespace" . }}
  labels:
    {{- include "tt-dra-driver.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
