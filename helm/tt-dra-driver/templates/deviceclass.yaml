---
apiVersion: {{ include "tt-dra-driver.resourceApiVersion" . }}
kind: DeviceClass
metadata:
  name: {{ include "tt-dra-driver.driverName" . }}
spec:
  extendedResourceName: tenstorrent.com/chip
  selectors:
  - cel:
      expression: "device.driver == '{{ include "tt-dra-driver.driverName" . }}'"
