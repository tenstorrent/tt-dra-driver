# Default values for tt-dra-driver.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
selectorLabelsOverride: {}

# deviceProfile selects the kind of devices managed by this driver
# instance. Currently the only supported profile is "tenstorrent".
deviceProfile: "tenstorrent"

# driverName uniquely identifies the driver within the cluster. When empty
# its value is derived from the deviceProfile.
driverName: ""

imagePullSecrets: []
image:
  repository: ghcr.io/tenstorrent/tt-dra-driver
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

kubeletPlugin:
  # numDevices controls how many simulated devices the bootstrap
  # `tenstorrent` profile advertises on each node. Real device discovery
  # will replace this in a follow-up.
  numDevices: 1
  priorityClassName: "system-node-critical"
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
  kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
  containers:
    plugin:
      securityContext:
        privileged: true
      resources: {}
      # Port for the gRPC liveness service. Set to a negative value to
      # disable the service and the probe.
      healthcheckPort: 51515
