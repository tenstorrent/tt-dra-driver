# Default values for tt-dra-driver.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
selectorLabelsOverride: {}

# deviceProfile selects the kind of devices managed by this driver
# instance. Currently the only supported profile is "tenstorrent".
deviceProfile: "tenstorrent"

# driverName uniquely identifies the driver within the cluster. When empty
# its value is derived from the deviceProfile.
driverName: ""

imagePullSecrets: []
image:
  repository: ghcr.io/tenstorrent/tt-dra-driver
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

kubeletPlugin:
  # fabricManagerAgentAddress is the host:port the kubelet plugin uses to
  # talk to the per-node Tenstorrent Fabric Manager (TTFM) agent and
  # enumerate local ASICs. The default assumes the FM agent and the DRA
  # driver share a node-local network namespace (e.g. via hostNetwork or a
  # node-local Service). Override per cluster as needed.
  fabricManagerAgentAddress: "localhost:50053"
  priorityClassName: "system-node-critical"
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
  kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
  containers:
    plugin:
      securityContext:
        privileged: true
      resources: {}
      # Port for the gRPC liveness service. Set to a negative value to
      # disable the service and the probe.
      healthcheckPort: 51515
