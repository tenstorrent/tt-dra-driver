name: Build and push Helm Chart

on:
  workflow_call:
    inputs:
      version:
        description: "The version of the chart"
        required: true
        type: string
      context:
        description: "The build context"
        required: true
        type: string
      chart:
        description: "The chart to build"
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Chart
        working-directory: helm/tt-dra-driver
        run: |
          sed -i "s/0.0.0-dev/${{ inputs.version }}/g" Chart.yaml
          sed -i "s/latest/${{ inputs.version }}/g" Chart.yaml
          helm package .
          helm push ${{ inputs.chart }}-${{ inputs.version }}.tgz oci://ghcr.io/tenstorrent/helm/