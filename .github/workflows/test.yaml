name: test

# Runs the Go test suite on every pull request, alongside the static checks in
# check.yaml.
#
# A single invocation covers every kind: the unit tests around DeviceState,
# the checkpoint and the CDI handler; the end-to-end smoke suite that starts a
# real driver against a fake fabric manager agent and drives it over the two
# gRPC sockets the kubelet uses; and the chart render tests under test/chart.
# None of them needs Tenstorrent hardware or a Kubernetes cluster, which is
# what lets this run on a plain GitHub runner.
#
# -race is set here but left out of the default `make test`, so that a local
# run stays as quick as possible while CI gets the stricter check. It is worth
# it because the driver is a concurrent daemon -- DeviceState is mutex-guarded
# and ResourceSlice publishing happens on a background controller -- and the
# end-to-end harness drives it from several goroutines at once. The cost is
# small: the suite's wall time is dominated by the publish sync delay rather
# than by CPU, so the detector barely lengthens it.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    # The suite takes well under a minute. This is only here so that a wedged
    # socket wait fails the run instead of occupying a runner for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # From go.mod, so the toolchain cannot drift from what the module
      # targets. Matches check.yaml.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The chart render tests compare `helm template` output against checked-in
      # manifests, and skip themselves when helm is missing -- which would make
      # them silently stop covering anything here. The version is pinned
      # because the golden files are byte-exact: bump it in step with
      # goldenHelmMajor and a regenerated testdata directory.
      - uses: azure/setup-helm@v4
        with:
          version: v4.1.4

      # `make test` builds the packages and the command binaries first, so this
      # step also covers compilation for the driver's GOOS.
      - name: Test
        run: make test TESTFLAGS=-race

      # Read from the profile the step above wrote. `make coverage` would be
      # the obvious call, but it declares `test` as a prerequisite and would
      # therefore run the whole suite a second time.
      #
      # The profile is measured across the module rather than per package, so
      # this total is the union over every test: code the end-to-end suite
      # drives through the fabric manager client and the Tenstorrent profile
      # counts for those packages. The per-package percentages `go test`
      # prints above are each only one test binary's share of that same set,
      # and are not the number to read.
      - name: Coverage summary
        run: go tool cover -func=coverage.out
